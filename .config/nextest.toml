experimental = ["setup-scripts"]

[test-groups.deployment-role-ports]
max-threads = 1

# Only fixtures that bind/release the host's role-port ranges need exclusion.
# In particular, ephemeral-port I/O/backpressure tests must not hold this group.
[[profile.default.overrides]]
filter = "(package(wrix-service) & ((binary(wrix_service) & test(control::)) | binary(deployment_endpoints) | binary(host_service))) | (package(wrix-cli) & (binary(service_cache) | (binary(service_lifecycle) & !test(public_cli_shared_native_backend_preserves_namespaces_and_denies_peer_sql)) | (binary(workspace_admission) & test(hardening::consolidation))))"
test-group = "deployment-role-ports"

# These native fixtures own private networks but share a historical process lock.
# Serialize them separately, not against unrelated host-role-port fixtures.
[test-groups.native-shared-fixtures]
max-threads = 1

[[profile.default.overrides]]
filter = "(package(wrix-service) & binary(shared_startup)) | (package(wrix-cli) & binary(service_lifecycle) & test(public_cli_shared_native_backend_preserves_namespaces_and_denies_peer_sql))"
test-group = "native-shared-fixtures"

[scripts.setup.isolated-host-roots]
command = ["bash", "tests/prepare-isolated-host-roots.sh"]

[[profile.default.scripts]]
filter = "all()"
setup = "isolated-host-roots"

[scripts.setup.packaging-fixtures]
command = ["bash", "tests/prepare-native-fixtures.sh"]

[[profile.default.scripts]]
filter = "(package(wrix-cli) & (binary(service_cache) | binary(service_lifecycle) | binary(init_config) | binary(init_idempotency) | binary(init_prek) | binary(prek_bundle_build) | binary(prek_runtime) | (binary(workspace_admission) & test(hardening::consolidation)))) | (package(wrix-cache) & (binary(celler_backend) | binary(host_signed_exclusion))) | (package(wrix-service) & (binary(celler_auth) | binary(shared_startup)))"
setup = "packaging-fixtures"
