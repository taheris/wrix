experimental = ["setup-scripts"]

[test-groups.deployment-role-ports]
max-threads = 1

[[profile.default.overrides]]
filter = "package(wrix-service) | (package(wrix-cli) & (binary(service_cache) | binary(service_lifecycle)))"
test-group = "deployment-role-ports"

[scripts.setup.packaging-fixtures]
command = ["bash", "tests/prepare-native-fixtures.sh"]

[[profile.default.scripts]]
filter = "(package(wrix-cli) & (binary(service_lifecycle) | binary(init_config) | binary(init_idempotency) | binary(init_prek) | binary(prek_bundle_build) | binary(prek_runtime))) | (package(wrix-cache) & (binary(celler_backend) | binary(host_signed_exclusion))) | (package(wrix-service) & binary(celler_auth))"
setup = "packaging-fixtures"
