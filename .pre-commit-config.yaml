repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
        # Unified-diff context markers are significant whitespace.
        exclude: ^(lib/services/celler-work-drain\.patch|crates/wrix-service/src/lifecycle/drain/native/compiler\.patch)$
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: ^(\.beads/config\.yaml|lib/services/celler-work-drain\.patch|crates/wrix-service/src/lifecycle/drain/native/compiler\.patch)$
      - id: check-merge-conflict
        stages: [pre-commit]

  - repo: local
    hooks:
      # Fast pre-commit checks
      - id: treefmt
        name: treefmt
        entry: treefmt --no-cache --fail-on-change
        language: system
        pass_filenames: true
        stages: [pre-commit]

      - id: shell-reexec-explicit-interpreter
        name: shell re-exec must invoke interpreter explicitly
        entry: scripts/check-shell-reexec
        language: system
        types: [shell]
        pass_filenames: true
        stages: [pre-commit]

      # Slow tests use loom markers
      - id: nix-flake-check
        name: nix flake check
        fail_fast: true
        entry: >-
          bin/pre-push-checks --hook-id nix-flake-check
          --hook-entry 'nix flake check' -- nix flake check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: loom-gate-verify
        name: loom gate verify
        entry: >-
          bin/pre-push-checks --hook-id loom-gate-verify
          --hook-entry 'skip-if-missing loom -- env WRIX_PRE_PUSH=1 RUSTC_WRAPPER= CARGO_BUILD_RUSTC_WRAPPER= loom gate verify --diff @{upstream}..HEAD' --
          skip-if-missing loom -- env WRIX_PRE_PUSH=1 RUSTC_WRAPPER= CARGO_BUILD_RUSTC_WRAPPER= loom gate verify --diff @{upstream}..HEAD
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
