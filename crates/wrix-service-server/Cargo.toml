[package]
name = "wrix-service-server"
edition.workspace = true
license.workspace = true
version.workspace = true
autobins = false
autotests = false
autoexamples = false

[lib]
path = "src/lib.rs"

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
displaydoc = { workspace = true }
fs2 = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }
rama-core = { workspace = true }
rama-http = { workspace = true }
rama-http-core = { workspace = true }
rama-net = { workspace = true }
rama-tcp = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
wrix-cache = { workspace = true }
wrix-core = { workspace = true }
wrix-service = { workspace = true }
wrix-state = { workspace = true }
wrix-sandbox = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true }

[dev-dependencies]
nix = { workspace = true, features = ["fs"] }
rustix = { workspace = true, features = ["pipe"] }
attic = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
wrix-cli = { workspace = true }

